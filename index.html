<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trade Data Generator Pro</title>
  
  <!-- Tailwind CSS Compiler -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- html-to-image Library -->

  <!-- External Font Request -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #52525b; }

    input[type="color"] {
      -webkit-appearance: none;
      border: 1px solid #333;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      padding: 0;
      background: transparent;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 5px;}
    
    input[type="checkbox"] {
      accent-color: #ffffff;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    
    input[type="range"] {
      accent-color: #ffffff;
      height: 4px;
      background: #27272a;
      border-radius: 4px;
      appearance: none;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
    }
  </style>
</head>

        <label class="flex items-center gap-2 text-sm text-zinc-400"><input type="checkbox" id="chk-chart" checked> Line Chart & Tags</label>
        <label class="flex items-center gap-2 text-sm text-zinc-400"><input type="checkbox" id="chk-badge" checked> Ticker Badge (100)</label>
        <label class="flex items-center gap-2 text-sm text-zinc-400"><input type="checkbox" id="chk-ticker" checked> Ticker Text</label>
        <label class="flex items-center gap-2 text-sm text-zinc-400"><input type="checkbox" id="chk-pnl-box" checked> PnL Box</label>

        <label class="flex items-center gap-2 text-sm text-zinc-400"><input type="checkbox" id="chk-exit" checked> Exit Row</label>

      <div class="grid grid-cols-2 gap-y-3 gap-x-4">
        <label class="flex items-center justify-between text-sm text-zinc-400">
          Top Text <input type="color" id="color-top" value="#ffffff" list="preset-colors">
        </label>
        <label class="flex items-center justify-between text-sm text-zinc-400">
          Ticker Name <input type="color" id="color-ticker" value="#ffffff" list="preset-colors">
        </label>
        <label class="flex items-center justify-between text-sm text-zinc-400">
          PnL Box BG <input type="color" id="color-pnl-bg" value="#86D99F" list="preset-colors">

        <label class="flex items-center justify-between text-sm text-zinc-400">

    <!-- Action Buttons -->

      <button onclick="downloadImage()" class="bg-white hover:bg-zinc-200 text-black font-bold py-3 rounded-xl w-2/3 transition-colors">

  <!-- Real-Time DOM Preview -->
  <div id="capture-area" class="relative w-[360px] h-[640px] bg-black bg-cover bg-center overflow-hidden tracking-[-0.04em]" style="background-image: none;">

        <div id="marker-s" class="absolute hidden flex items-center justify-center w-[16px] h-[16px] bg-[#ff6b6b] text-black text-[9px] font-extrabold rounded-[3px] shadow-sm transform -translate-x-1/2 -translate-y-full mb-[2px]">S</div>
        <div id="marker-b" class="absolute hidden flex items-center justify-center w-[16px] h-[16px] bg-[#86D99F] text-black text-[9px] font-extrabold rounded-[3px] shadow-sm transform -translate-x-1/2 mt-[2px]">B</div>
      </div>

      <!-- Variable Output Block -->
      <div class="mt-auto px-6 mb-4 w-full">
        <!-- Ticker Output -->
        <div class="flex items-center gap-3 mb-2" id="out-ticker-container">
          <div id="out-ticker-badge" class="w-10 h-10 rounded-full bg-[#009ee3] flex items-center justify-center text-white font-bold text-[13px] tracking-normal leading-none">100</div>
          <div class="text-[28px] font-medium leading-none" id="out-ticker" style="color: #ffffff;">NQ1!</div>
        </div>

        <!-- Profit Pill Output -->
        <div class="mt-5 text-[42px] leading-none font-extrabold py-2 px-2 rounded-xl inline-flex items-center justify-center mb-8" 
             id="out-short-pnl" style="background-color: #86D99F; color: #000000;">
          +$12.4k
        </div>

        <!-- Trade Variables -->
        <div class="space-y-[18px] text-[19px] leading-none">
          <div class="flex justify-between items-center w-full" id="out-row-contracts">
            <span class="font-bold out-label" style="color: #d4d4d8;">Contracts</span>
            <span class="text-white font-bold text-right" id="out-contracts">3</span>
          </div>
          <div class="flex justify-between items-center w-full" id="out-row-entry">
            <span class="font-bold out-label" style="color: #d4d4d8;">Entry Price</span>
            <span class="text-white font-bold text-right" id="out-entry">$28,698.50</span>
          </div>
          <div class="flex justify-between items-center w-full" id="out-row-exit">
            <span class="font-bold out-label" style="color: #d4d4d8;">Exit Price</span>
            <span class="text-white font-bold text-right" id="out-exit">$29,912.25</span>
          </div>
          <div class="flex justify-between items-center w-full pt-4" id="out-row-total-pnl">
            <span class="font-bold out-label" style="color: #d4d4d8;">Total PnL</span>
            <span class="font-bold text-right" id="out-total-pnl" style="color: #86D99F;">$12,438.50</span>
          </div>
        </div>
      </div>

      <!-- Bottom Text Row -->
      <div class="flex justify-between items-center text-[14px] leading-none mt-auto pb-6 px-6 font-semibold" id="out-bottom-row" style="color: #ffffff;">
        <span id="out-website">celesto.github.io</span>
        <span id="out-handle">@jenztornado</span>
      </div>
    </div>
  </div>

  <script>
    const captureArea = document.getElementById('capture-area');

    // --- 0. TRADOVATE CSV PARSER (Self-Healing Update) ---
    function csvToArray(text) {
      let p = '', row = [''], ret = [row], i = 0, r = 0, s = !0, l;
      for (l of text) {
        if ('"' === l) {
          if (s && l === p) row[i] += l;
          s = !s;
        } else if (',' === l && s) l = row[++i] = '';
        else if ('\n' === l && s) {
          if ('\r' === p) row[i] = row[i].slice(0, -1);
          row = ret[++r] = [l = '']; i = 0;
        } else row[i] += l;
        p = l;
      }
      return ret.filter(r => r.length > 1);
    }

    function formatCurrencyStrings(amount) {
      const isPositive = amount >= 0;
      const sign = isPositive ? '+$' : '-$';
      const absVal = Math.abs(amount);
      const totalStr = sign + absVal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
      const shortStr = sign + (absVal >= 1000 ? (absVal / 1000).toFixed(1) + 'k' : absVal.toFixed(2));
      return { totalStr, shortStr };
    }

    document.getElementById('upload-csv').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const rows = csvToArray(event.target.result);
          if (rows.length < 2) throw new Error("CSV is empty or invalid.");

          const headers = rows[0].map(h => h.trim().toLowerCase());
          const findCol = (keywords) => headers.findIndex(h => keywords.some(k => h.includes(k)));

          const idxSymbol = findCol(['symbol', 'contract', 'product', 'ticker']);
          const idxQty = findCol(['qty', 'quantity', 'size', 'contracts']);
          const idxEntryPrice = findCol(['entry price', 'open price', 'avg entry', 'buy price']);
          const idxExitPrice = findCol(['exit price', 'close price', 'avg exit', 'sell price']);
          const idxEntryTime = findCol(['entry time', 'open time', 'timestamp', 'date in']);
          const idxExitTime = findCol(['exit time', 'close time', 'date out']);
          const idxPnl = findCol(['p&l', 'pnl', 'profit', 'net']);

          const data = rows[1]; 

          if(idxSymbol !== -1 && data[idxSymbol]) document.getElementById('in-ticker').value = data[idxSymbol].trim();
          if(idxQty !== -1 && data[idxQty]) document.getElementById('in-contracts').value = data[idxQty].trim();
          if(idxEntryPrice !== -1 && data[idxEntryPrice]) document.getElementById('in-entry').value = "$" + parseFloat(data[idxEntryPrice]).toFixed(2);
          if(idxExitPrice !== -1 && data[idxExitPrice]) document.getElementById('in-exit').value = "$" + parseFloat(data[idxExitPrice]).toFixed(2);

          // Update PnL - With Failsafe for unquoted missing commas
          if(idxPnl !== -1 && data[idxPnl]) {
            let pnlString = data[idxPnl];
            
            // SELF-HEALING CSV PATCH: Stitches broken money formats back together
            if (data.length > headers.length && data[idxPnl + 1] && /^[0-9]+/.test(data[idxPnl + 1].trim())) {
              pnlString += data[idxPnl + 1];
            }

            const rawPnl = parseFloat(pnlString.replace(/[^0-9.-]+/g, ""));
            const { totalStr, shortStr } = formatCurrencyStrings(rawPnl);
            document.getElementById('in-total-pnl').value = totalStr;
            document.getElementById('in-short-pnl').value = shortStr;
          }

          if(idxEntryTime !== -1 && data[idxEntryTime]) {
            const dateObj = new Date(data[idxEntryTime]);
            if(!isNaN(dateObj)) {
              document.getElementById('in-date').value = dateObj.getFullYear() + "-" + String(dateObj.getMonth() + 1).padStart(2, '0') + "-" + String(dateObj.getDate()).padStart(2, '0');
              document.getElementById('in-entry-time').value = dateObj.toTimeString().slice(0,5);
            }
          }

          if(idxExitTime !== -1 && data[idxExitTime]) {
            const dateObj = new Date(data[idxExitTime]);
            if(!isNaN(dateObj)) {
              document.getElementById('in-exit-time').value = dateObj.toTimeString().slice(0,5);
            }
          }

          document.querySelectorAll('input').forEach(input => input.dispatchEvent(new Event('input')));
          fetchAndRenderRealChart();
          
          alert("Trade successfully imported from CSV!");
        } catch (error) {
          console.error("CSV Parse Error:", error);
          alert("Failed to parse CSV. Ensure it is a valid export file.");
        }
      };
      reader.readAsText(file);
    });

    // --- 1. BACKGROUND LOGIC ---
    const bgContainer = document.getElementById('bg-selector');
    for(let i = 1; i <= 10; i++) {
      const btn = document.createElement('button');
      btn.className = "w-full aspect-square bg-zinc-800 rounded-md overflow-hidden border-2 border-transparent hover:border-zinc-500 transition-all bg-cover bg-center";
      btn.style.backgroundImage = `url('assets/${i}.jpeg')`;
      btn.onclick = () => {
        Array.from(bgContainer.children).forEach(child => child.classList.replace('border-white', 'border-transparent'));
        btn.classList.replace('border-transparent', 'border-white');
        captureArea.style.backgroundImage = `url('assets/${i}.jpeg')`;
      };
      bgContainer.appendChild(btn);
    }

    document.getElementById('upload-bg').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          Array.from(bgContainer.children).forEach(child => child.classList.replace('border-white', 'border-transparent'));
          captureArea.style.backgroundImage = `url('${event.target.result}')`;
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('in-dimmer').addEventListener('input', (e) => {
      document.getElementById('bg-overlay').style.opacity = e.target.value;
    });

    // --- 2. BINDINGS ---
    const textDataNodes = [
      { in: 'in-name', out: 'out-name' }, { in: 'in-handle', out: 'out-handle' },
      { in: 'in-ticker', out: 'out-ticker' }, { in: 'in-short-pnl', out: 'out-short-pnl' },
      { in: 'in-contracts', out: 'out-contracts' }, { in: 'in-entry', out: 'out-entry' },
      { in: 'in-exit', out: 'out-exit' }, { in: 'in-total-pnl', out: 'out-total-pnl' }
    ];
    textDataNodes.forEach(node => {
      document.getElementById(node.in).addEventListener('input', (e) => { document.getElementById(node.out).textContent = e.target.value; });
    });

    const colorMaps = [
      { input: 'color-top', targetId: 'out-top-row', prop: 'color' },
      { input: 'color-ticker', targetId: 'out-ticker', prop: 'color' },
      { input: 'color-pnl-bg', targetId: 'out-short-pnl', prop: 'backgroundColor' },
      { input: 'color-pnl-text', targetId: 'out-short-pnl', prop: 'color' },
      { input: 'color-total', targetId: 'out-total-pnl', prop: 'color' },
      { input: 'color-bottom', targetId: 'out-bottom-row', prop: 'color' }
    ];
    colorMaps.forEach(map => {
      document.getElementById(map.input).addEventListener('input', (e) => { document.getElementById(map.targetId).style[map.prop] = e.target.value; });
    });
    document.getElementById('color-labels').addEventListener('input', (e) => {
      document.querySelectorAll('.out-label').forEach(el => el.style.color = e.target.value);
    });

    const visibilityNodes = [
      { check: 'chk-brand', target: 'out-brand' }, { check: 'chk-separator', target: 'out-separator' },
      { check: 'chk-name', target: 'out-name' }, { check: 'chk-chart', target: 'out-chart-container' },
      { check: 'chk-badge', target: 'out-ticker-badge' }, { check: 'chk-ticker', target: 'out-ticker' },
      { check: 'chk-pnl-box', target: 'out-short-pnl' }, { check: 'chk-contracts', target: 'out-row-contracts' },
      { check: 'chk-entry', target: 'out-row-entry' }, { check: 'chk-exit', target: 'out-row-exit' },
      { check: 'chk-total', target: 'out-row-total-pnl' }, { check: 'chk-website', target: 'out-website' },
      { check: 'chk-handle', target: 'out-handle' }
    ];
    visibilityNodes.forEach(node => {
      document.getElementById(node.check).addEventListener('change', (e) => {
        document.getElementById(node.target).style.display = e.target.checked ? '' : 'none';
      });
    });

    // --- 3. SAVE AND LOAD STATE ---
    function saveSettings() {
      const settings = {};
      const inputs = document.querySelectorAll('input');
      inputs.forEach(input => {
        if (input.type === 'file' || input.id === 'upload-csv') return;
        settings[input.id] = input.type === 'checkbox' ? input.checked : input.value;
      });
      settings['bg-image'] = document.getElementById('capture-area').style.backgroundImage;
      
      try {
        localStorage.setItem('tradeGeneratorSettings', JSON.stringify(settings));
        alert('Preset saved successfully! It will automatically load next time.');
      } catch (e) {
        alert('Could not save settings (Custom image might be too large).');
      }
    }

    function loadSettings() {
      const saved = localStorage.getItem('tradeGeneratorSettings');
      if (saved) {
        const settings = JSON.parse(saved);
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
          if (input.type === 'file' || input.id === 'upload-csv') return;
          if (settings[input.id] !== undefined) {
            if (input.type === 'checkbox') {
              input.checked = settings[input.id];
              input.dispatchEvent(new Event('change'));
            } else {
              input.value = settings[input.id];
              input.dispatchEvent(new Event('input'));
            }
          }
        });
        if (settings['bg-image']) {
          document.getElementById('capture-area').style.backgroundImage = settings['bg-image'];
        }
      }
    }

    // --- 4. CHART & API LOGIC ---
    function drawSVGPath(svg, markerS, markerB, priceData, timestamps, isFallback = false) {
      const minPrice = Math.min(...priceData);
      const maxPrice = Math.max(...priceData);
      const range = maxPrice - minPrice || 1;
      const width = svg.clientWidth || 360;
      const height = svg.clientHeight || 320;

      let entryIndex = 0, exitIndex = priceData.length - 1;

      if (!isFallback && timestamps && timestamps.length > 0) {
        const dateVal = document.getElementById('in-date').value;
        const entryTimeVal = document.getElementById('in-entry-time').value;
        const exitTimeVal = document.getElementById('in-exit-time').value;
        const entryUnix = Math.floor(new Date(`${dateVal}T${entryTimeVal}:00`).getTime() / 1000);
        const exitUnix = Math.floor(new Date(`${dateVal}T${exitTimeVal}:00`).getTime() / 1000);

        let minEntryDiff = Infinity, minExitDiff = Infinity;
        timestamps.forEach((ts, i) => {
          if (Math.abs(ts - entryUnix) < minEntryDiff) { minEntryDiff = Math.abs(ts - entryUnix); entryIndex = i; }
          if (Math.abs(ts - exitUnix) < minExitDiff) { minExitDiff = Math.abs(ts - exitUnix); exitIndex = i; }
        });
        if (entryIndex > exitIndex) { const temp = entryIndex; entryIndex = exitIndex; exitIndex = temp; }
      } else {
        entryIndex = Math.floor(priceData.length * 0.25);
        exitIndex = Math.floor(priceData.length * 0.85);
      }

      let pathString = ''; let entryCoords = { x: 0, y: 0 }; let exitCoords = { x: 0, y: 0 };

      priceData.forEach((price, index) => {
        const x = (index / (priceData.length - 1)) * width;
        const y = height - (((price - minPrice) / range) * height); 
        if (index === 0) pathString += `M ${x} ${y} `; else pathString += `L ${x} ${y} `;
        if (index === entryIndex) entryCoords = { x, y };
        if (index === exitIndex) exitCoords = { x, y };
      });

      svg.innerHTML = `<path d="${pathString}" fill="none" stroke="rgba(255, 255, 255, 0.7)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />`;
      markerS.style.left = `${entryCoords.x}px`; markerS.style.top = `${entryCoords.y}px`; markerS.classList.remove('hidden');
      markerB.style.left = `${exitCoords.x}px`; markerB.style.top = `${exitCoords.y}px`; markerB.classList.remove('hidden');
    }

    async function fetchAndRenderRealChart() {
      const svg = document.getElementById('price-chart');
      const markerS = document.getElementById('marker-s');
      const markerB = document.getElementById('marker-b');
      const symbol = "NQ=F"; 
      const url = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1m&range=7d`;
      const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;

      try {
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error("Network response was not ok");
        const data = await response.json();
        
        const rawTimestamps = data.chart.result[0].timestamp;
        const rawPrices = data.chart.result[0].indicators.quote[0].close;
        const dateVal = document.getElementById('in-date').value;
        if(!dateVal) return;

        const startOfDayUnix = Math.floor(new Date(`${dateVal}T00:00:00`).getTime() / 1000);
        const endOfDayUnix = Math.floor(new Date(`${dateVal}T23:59:59`).getTime() / 1000);

        let dayTimestamps = [], priceData = [];
        for (let i = 0; i < rawTimestamps.length; i++) {
          if (rawTimestamps[i] >= startOfDayUnix && rawTimestamps[i] <= endOfDayUnix && rawPrices[i] !== null) {
            dayTimestamps.push(rawTimestamps[i]); priceData.push(rawPrices[i]);
          }
        }
        if(priceData.length === 0) throw new Error("No data for this specific date.");
        drawSVGPath(svg, markerS, markerB, priceData, dayTimestamps, false);
      } catch (error) {
        console.warn("API Blocked or Failed. Rendering Fallback Chart.", error);
        const fallbackData = [100, 102, 101, 104, 103, 106, 105, 108, 107, 109, 112, 110, 108, 105, 101, 95, 88, 80, 70, 60, 55, 45, 35, 30, 25, 20, 15, 12, 10, 8, 12, 15, 14, 18, 16, 22, 20, 25, 24, 28];
        drawSVGPath(svg, markerS, markerB, fallbackData, null, true);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadSettings(); 
      fetchAndRenderRealChart(); 
    });
    
    document.getElementById('in-date').addEventListener('input', fetchAndRenderRealChart);
    document.getElementById('in-entry-time').addEventListener('input', fetchAndRenderRealChart);
    document.getElementById('in-exit-time').addEventListener('input', fetchAndRenderRealChart);

    // --- 5. EXPORT ---
    function downloadImage() {
      const targetDOM = document.getElementById('capture-area');
      document.fonts.ready.then(() => {
        htmlToImage.toPng(targetDOM, { pixelRatio: 3, useCORS: true })
          .then(() => htmlToImage.toPng(targetDOM, { pixelRatio: 3, useCORS: true }))
          .then(dataUrl => {
            const fileLink = document.createElement('a');
            fileLink.download = 'trade-summary.png';
            fileLink.href = dataUrl;
            fileLink.click();
          })
          .catch(error => {
            console.error('Render error:', error);
            alert('Generation failed. Check console for details.');
          });
      });
    }
  </script>
