<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trade Data Generator Pro</title>
  
  <!-- Tailwind CSS Compiler -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- html-to-image Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>

  <!-- External Font Request -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* Global Inter Font & Custom Scrollbar for minimal aesthetic */
    body { font-family: 'Inter', sans-serif; }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #52525b; }

    /* Modernize color picker inputs */
    input[type="color"] {
      -webkit-appearance: none;
      border: 1px solid #333;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      padding: 0;
      background: transparent;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 5px;}
  </style>
</head>
<body class="bg-[#09090b] text-white min-h-screen p-8 flex flex-col md:flex-row gap-12 items-center justify-center">

  <!-- Minimalist Data Input Form -->
  <div class="bg-[#18181b] border border-[#27272a] p-6 rounded-2xl w-full max-w-[420px] flex flex-col gap-5 max-h-[90vh] overflow-y-auto shadow-2xl">
    
    <div>
      <h2 class="text-xl font-bold tracking-tight text-white">Trade Setup</h2>
      <p class="text-xs text-zinc-400 mt-1">Configure your visual trade summary.</p>
    </div>
    
    <!-- 1. Background Image Selector -->
    <div class="space-y-2">
      <span class="text-xs font-semibold text-zinc-300 uppercase tracking-wider">Background</span>
      <div class="grid grid-cols-5 gap-2" id="bg-selector">
        <!-- JS will populate thumbnails 1.jpeg to 10.jpeg here -->
      </div>
    </div>

    <!-- 2. Profile Details -->
    <div class="flex gap-4">
      <label class="flex flex-col text-sm text-zinc-400 w-1/2">
        Name
        <input type="text" id="in-name" value="JENZ" class="mt-1 p-2 bg-[#09090b] border border-zinc-800 text-white rounded-lg outline-none focus:border-zinc-500 transition-colors">
      </label>
      <label class="flex flex-col text-sm text-zinc-400 w-1/2">
        Handle
        <input type="text" id="in-handle" value="@jenztornado" class="mt-1 p-2 bg-[#09090b] border border-zinc-800 text-white rounded-lg outline-none focus:border-zinc-500 transition-colors">
      </label>
    </div>

    <!-- 3. Market Data & Times -->
    <div class="flex flex-col gap-3 p-4 bg-[#09090b] rounded-xl border border-zinc-800">
      <label class="flex flex-col text-sm text-zinc-400">
        Trade Date
        <input type="date" id="in-date" value="2026-08-04" class="mt-1 p-2 bg-[#18181b] border border-zinc-800 text-white rounded-lg outline-none focus:border-zinc-500">
      </label>
      <div class="flex gap-4">
        <label class="flex flex-col text-sm text-zinc-400 w-1/2">
          Entry Time (Local)
          <input type="time" id="in-entry-time" value="20:00" class="mt-1 p-2 bg-[#18181b] border border-zinc-800 text-white rounded-lg outline-none focus:border-zinc-500">
        </label>
        <label class="flex flex-col text-sm text-zinc-400 w-1/2">
          Exit Time (Local)
          <input type="time" id="in-exit-time" value="20:45" class="mt-1 p-2 bg-[#18181b] border border-zinc-800 text-white rounded-lg outline-none focus:border-zinc-500">
        </label>
      </div>
    </div>

    <!-- 4. Trade Variables -->
    <div class="grid grid-cols-2 gap-4">
      <label class="flex flex-col text-sm text-zinc-400">
        Ticker
        <input type="text" id="in-ticker" value="NQ1!" class="mt-1 p-2 bg-[#09090b] border border-zinc-800 text-white rounded-lg outline-none focus:border-zinc-500">
      </label>
      <label class="flex flex-col text-sm text-zinc-400">
        Contracts
        <input type="number" id="in-contracts" value="3" class="mt-1 p-2 bg-[#09090b] border border-zinc-800 text-white rounded-lg outline-none focus:border-zinc-500">
      </label>
      <label class="flex flex-col text-sm text-zinc-400">
        Entry Price
        <input type="text" id="in-entry" value="$28,698.50" class="mt-1 p-2 bg-[#09090b] border border-zinc-800 text-white rounded-lg outline-none focus:border-zinc-500">
      </label>
      <label class="flex flex-col text-sm text-zinc-400">
        Exit Price
        <input type="text" id="in-exit" value="$29,912.25" class="mt-1 p-2 bg-[#09090b] border border-zinc-800 text-white rounded-lg outline-none focus:border-zinc-500">
      </label>
      <label class="flex flex-col text-sm text-zinc-400">
        Short PnL Text
        <input type="text" id="in-short-pnl" value="+$12.4k" class="mt-1 p-2 bg-[#09090b] border border-zinc-800 text-white rounded-lg outline-none focus:border-zinc-500">
      </label>
      <label class="flex flex-col text-sm text-zinc-400">
        Total PnL
        <input type="text" id="in-total-pnl" value="$12,438.50" class="mt-1 p-2 bg-[#09090b] border border-zinc-800 text-white rounded-lg outline-none focus:border-zinc-500">
      </label>
    </div>

    <!-- 5. Color Customization -->
    <div class="space-y-3 pt-2 border-t border-zinc-800">
      <span class="text-xs font-semibold text-zinc-300 uppercase tracking-wider">Colors</span>
      
      <div class="grid grid-cols-2 gap-y-3 gap-x-4">
        <label class="flex items-center justify-between text-sm text-zinc-400">
          Top Text
          <input type="color" id="color-top" value="#ffffff">
        </label>
        <label class="flex items-center justify-between text-sm text-zinc-400">
          Ticker Name
          <input type="color" id="color-ticker" value="#ffffff">
        </label>
        <label class="flex items-center justify-between text-sm text-zinc-400">
          PnL Box BG
          <input type="color" id="color-pnl-bg" value="#86D99F">
        </label>
        <label class="flex items-center justify-between text-sm text-zinc-400">
          PnL Box Text
          <input type="color" id="color-pnl-text" value="#000000">
        </label>
        <label class="flex items-center justify-between text-sm text-zinc-400">
          Stats Labels
          <input type="color" id="color-labels" value="#d4d4d8">
        </label>
        <label class="flex items-center justify-between text-sm text-zinc-400">
          Total PnL
          <input type="color" id="color-total" value="#86D99F">
        </label>
        <label class="flex items-center justify-between text-sm text-zinc-400">
          Bottom Text
          <input type="color" id="color-bottom" value="#ffffff">
        </label>
      </div>
    </div>

    <button onclick="downloadImage()" class="mt-2 bg-white hover:bg-zinc-200 text-black font-bold py-3 rounded-xl w-full transition-colors">
      Export Image
    </button>
  </div>

  <!-- Real-Time DOM Preview -->
  <!-- Background starts explicitly black until image selected -->
  <div id="capture-area" class="relative w-[360px] h-[640px] bg-black bg-cover bg-center overflow-hidden tracking-[-0.04em]" style="background-image: none;">
    
    <div class="relative z-10 flex flex-col h-full pointer-events-none">
      
      <!-- Top Text Row -->
      <div class="flex justify-start items-center text-[22px] px-6 pt-6 leading-none relative z-10" id="out-top-row" style="color: #ffffff;">
        <span class="font-bold">CELESTO</span>
        <span class="mx-2 font-medium pb-1 opacity-75">×</span>
        <span class="font-medium" id="out-name">JENZ</span>
      </div>

      <!-- SVG Price Chart Overlay (Sits behind text) -->
      <div class="absolute top-[80px] left-0 w-full h-[320px] pointer-events-none z-0">
        <svg id="price-chart" class="w-full h-full overflow-visible" preserveAspectRatio="none"></svg>
        
        <!-- S & B Markers -->
        <div id="marker-s" class="absolute hidden flex items-center justify-center w-[16px] h-[16px] bg-[#ff6b6b] text-black text-[9px] font-extrabold rounded-[3px] shadow-sm transform -translate-x-1/2 -translate-y-full mb-[2px]">S</div>
        <div id="marker-b" class="absolute hidden flex items-center justify-center w-[16px] h-[16px] bg-[#86D99F] text-black text-[9px] font-extrabold rounded-[3px] shadow-sm transform -translate-x-1/2 mt-[2px]">B</div>
      </div>

      <!-- Variable Output Block -->
      <div class="mt-auto px-6 mb-4 w-full relative z-10">
        
        <!-- Ticker Output -->
        <div class="flex items-center gap-3 mb-2">
          <div class="w-10 h-10 rounded-full bg-[#009ee3] flex items-center justify-center text-white font-bold text-[13px] tracking-normal leading-none">
            100
          </div>
          <div class="text-[28px] font-medium leading-none" id="out-ticker" style="color: #ffffff;">NQ1!</div>
        </div>

        <!-- Profit Pill Output -->
        <div class="mt-5 text-[42px] leading-none font-extrabold py-2 px-2 rounded-xl inline-flex items-center justify-center mb-8" 
             id="out-short-pnl" style="background-color: #86D99F; color: #000000;">
          +$12.4k
        </div>

        <!-- Trade Variables -->
        <div class="space-y-[18px] text-[19px] leading-none">
          <div class="flex justify-between items-center w-full">
            <span class="font-bold out-label" style="color: #d4d4d8;">Contracts</span>
            <span class="text-white font-bold text-right" id="out-contracts">3</span>
          </div>
          <div class="flex justify-between items-center w-full">
            <span class="font-bold out-label" style="color: #d4d4d8;">Entry Price</span>
            <span class="text-white font-bold text-right" id="out-entry">$28,698.50</span>
          </div>
          <div class="flex justify-between items-center w-full">
            <span class="font-bold out-label" style="color: #d4d4d8;">Exit Price</span>
            <span class="text-white font-bold text-right" id="out-exit">$29,912.25</span>
          </div>
          <div class="flex justify-between items-center w-full pt-4">
            <span class="font-bold out-label" style="color: #d4d4d8;">Total PnL</span>
            <span class="font-bold text-right" id="out-total-pnl" style="color: #86D99F;">$12,438.50</span>
          </div>
        </div>
      </div>

      <!-- Bottom Text Row -->
      <div class="flex justify-between items-center text-[14px] leading-none mt-auto pb-6 px-6 font-semibold relative z-10" id="out-bottom-row" style="color: #ffffff;">
        <span>celesto.github.io</span>
        <span id="out-handle">@jenztornado</span>
      </div>
    </div>
  </div>

  <script>
    // --- 1. POPULATE BACKGROUND IMAGE SELECTOR ---
    const bgContainer = document.getElementById('bg-selector');
    const captureArea = document.getElementById('capture-area');
    let selectedBgIndex = null;

    for(let i = 1; i <= 10; i++) {
      const btn = document.createElement('button');
      btn.className = "w-full aspect-square bg-zinc-800 rounded-md overflow-hidden border-2 border-transparent hover:border-zinc-500 transition-all bg-cover bg-center";
      btn.style.backgroundImage = `url('assets/${i}.jpeg')`;
      btn.onclick = () => {
        // Remove active state from all
        Array.from(bgContainer.children).forEach(child => child.classList.replace('border-white', 'border-transparent'));
        // Add active state to clicked
        btn.classList.replace('border-transparent', 'border-white');
        // Update Preview
        captureArea.style.backgroundImage = `url('assets/${i}.jpeg')`;
      };
      bgContainer.appendChild(btn);
    }

    // --- 2. TEXT BINDINGS ---
    const dataNodes = [
      { in: 'in-name', out: 'out-name' },
      { in: 'in-handle', out: 'out-handle' },
      { in: 'in-ticker', out: 'out-ticker' },
      { in: 'in-short-pnl', out: 'out-short-pnl' },
      { in: 'in-contracts', out: 'out-contracts' },
      { in: 'in-entry', out: 'out-entry' },
      { in: 'in-exit', out: 'out-exit' },
      { in: 'in-total-pnl', out: 'out-total-pnl' }
    ];
    
    dataNodes.forEach(node => {
      document.getElementById(node.in).addEventListener('input', (e) => {
        document.getElementById(node.out).textContent = e.target.value;
      });
    });

    // --- 3. COLOR BINDINGS ---
    const colorMaps = [
      { input: 'color-top', targetId: 'out-top-row', prop: 'color' },
      { input: 'color-ticker', targetId: 'out-ticker', prop: 'color' },
      { input: 'color-pnl-bg', targetId: 'out-short-pnl', prop: 'backgroundColor' },
      { input: 'color-pnl-text', targetId: 'out-short-pnl', prop: 'color' },
      { input: 'color-total', targetId: 'out-total-pnl', prop: 'color' },
      { input: 'color-bottom', targetId: 'out-bottom-row', prop: 'color' }
    ];

    // Map Single ID Colors
    colorMaps.forEach(map => {
      document.getElementById(map.input).addEventListener('input', (e) => {
        document.getElementById(map.targetId).style[map.prop] = e.target.value;
      });
    });

    // Map Multi-class Colors (Labels)
    document.getElementById('color-labels').addEventListener('input', (e) => {
      document.querySelectorAll('.out-label').forEach(el => {
        el.style.color = e.target.value;
      });
    });


    // --- 4. CHART & API LOGIC (Unchanged Structural Integrity) ---
    function parsePriceString(priceStr) {
      return parseFloat(priceStr.replace(/[^0-9.-]+/g, ""));
    }

    function drawSVGPath(svg, markerS, markerB, priceData, timestamps, isFallback = false) {
      const minPrice = Math.min(...priceData);
      const maxPrice = Math.max(...priceData);
      const range = maxPrice - minPrice || 1;
      
      const width = svg.clientWidth || 360;
      const height = svg.clientHeight || 320;

      let entryIndex = 0;
      let exitIndex = priceData.length - 1;

      if (!isFallback && timestamps && timestamps.length > 0) {
        const dateVal = document.getElementById('in-date').value;
        const entryTimeVal = document.getElementById('in-entry-time').value;
        const exitTimeVal = document.getElementById('in-exit-time').value;
        
        const entryUnix = Math.floor(new Date(`${dateVal}T${entryTimeVal}:00`).getTime() / 1000);
        const exitUnix = Math.floor(new Date(`${dateVal}T${exitTimeVal}:00`).getTime() / 1000);

        let minEntryDiff = Infinity;
        let minExitDiff = Infinity;

        timestamps.forEach((ts, i) => {
          if (Math.abs(ts - entryUnix) < minEntryDiff) {
            minEntryDiff = Math.abs(ts - entryUnix);
            entryIndex = i;
          }
          if (Math.abs(ts - exitUnix) < minExitDiff) {
            minExitDiff = Math.abs(ts - exitUnix);
            exitIndex = i;
          }
        });

        if (entryIndex > exitIndex) {
            const temp = entryIndex;
            entryIndex = exitIndex;
            exitIndex = temp;
        }
      } else {
        entryIndex = Math.floor(priceData.length * 0.25);
        exitIndex = Math.floor(priceData.length * 0.85);
      }

      let pathString = '';
      let entryCoords = { x: 0, y: 0 };
      let exitCoords = { x: 0, y: 0 };

      priceData.forEach((price, index) => {
        const x = (index / (priceData.length - 1)) * width;
        const y = height - (((price - minPrice) / range) * height); 

        if (index === 0) {
          pathString += `M ${x} ${y} `;
        } else {
          pathString += `L ${x} ${y} `;
        }

        if (index === entryIndex) entryCoords = { x, y };
        if (index === exitIndex) exitCoords = { x, y };
      });

      svg.innerHTML = `<path d="${pathString}" fill="none" stroke="rgba(255, 255, 255, 0.7)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />`;

      markerS.style.left = `${entryCoords.x}px`; 
      markerS.style.top = `${entryCoords.y}px`;
      markerS.classList.remove('hidden');

      markerB.style.left = `${exitCoords.x}px`;
      markerB.style.top = `${exitCoords.y}px`;
      markerB.classList.remove('hidden');
    }

    async function fetchAndRenderRealChart() {
      const svg = document.getElementById('price-chart');
      const markerS = document.getElementById('marker-s');
      const markerB = document.getElementById('marker-b');
      
      const symbol = "NQ=F"; 
      const url = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1m&range=7d`;
      const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;

      try {
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error("Network response was not ok");
        const data = await response.json();
        
        const rawTimestamps = data.chart.result[0].timestamp;
        const rawPrices = data.chart.result[0].indicators.quote[0].close;
        
        const dateVal = document.getElementById('in-date').value;
        if(!dateVal) return;

        const startOfDayUnix = Math.floor(new Date(`${dateVal}T00:00:00`).getTime() / 1000);
        const endOfDayUnix = Math.floor(new Date(`${dateVal}T23:59:59`).getTime() / 1000);

        let dayTimestamps = [];
        let priceData = [];
        for (let i = 0; i < rawTimestamps.length; i++) {
          if (rawTimestamps[i] >= startOfDayUnix && rawTimestamps[i] <= endOfDayUnix && rawPrices[i] !== null) {
            dayTimestamps.push(rawTimestamps[i]);
            priceData.push(rawPrices[i]);
          }
        }

        if(priceData.length === 0) {
          throw new Error("No data for this specific date.");
        }

        drawSVGPath(svg, markerS, markerB, priceData, dayTimestamps, false);

      } catch (error) {
        console.warn("API Blocked or Failed. Rendering Fallback Chart.", error);
        const fallbackData = [
          100, 102, 101, 104, 103, 106, 105, 108, 107, 109, 
          112, 110, 108, 105, 101, 95, 88, 80, 70, 60,      
          55, 45, 35, 30, 25, 20, 15, 12, 10, 8,            
          12, 15, 14, 18, 16, 22, 20, 25, 24, 28            
        ];
        drawSVGPath(svg, markerS, markerB, fallbackData, null, true);
      }
    }

    window.addEventListener('DOMContentLoaded', fetchAndRenderRealChart);
    document.getElementById('in-date').addEventListener('input', fetchAndRenderRealChart);
    document.getElementById('in-entry-time').addEventListener('input', fetchAndRenderRealChart);
    document.getElementById('in-exit-time').addEventListener('input', fetchAndRenderRealChart);


    // --- 5. RENDER AND DOWNLOAD ---
    function downloadImage() {
      const targetDOM = document.getElementById('capture-area');
      
      document.fonts.ready.then(() => {
        htmlToImage.toPng(targetDOM, { pixelRatio: 3, useCORS: true })
          .then(() => {
            return htmlToImage.toPng(targetDOM, { pixelRatio: 3, useCORS: true });
          })
          .then(function (dataUrl) {
            const fileLink = document.createElement('a');
            fileLink.download = 'trade-summary.png';
            fileLink.href = dataUrl;
            fileLink.click();
          })
          .catch(function (error) {
            console.error('Render error:', error);
            alert('Generation failed. Check console for details.');
          });
      });
    }
  </script>
</body>
</html>
